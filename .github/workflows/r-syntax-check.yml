name: R syntax check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  parse-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Verify required files
        run: |
          test -f scripts/compute_arid_batch.R
          test -f inputs/enso_years_1975_2025.csv
          test -f inputs/texas_cotton_area.geojson

      - name: Parse R scripts
        run: >-
          Rscript -e 'files <- list.files("scripts", pattern = "[.]R$", full.names = TRUE);
          invisible(lapply(files, parse));
          message("Parsed ", length(files), " R scripts successfully.")'
